[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aet-provider-contract"
version = "0.1.0"
description = "Framework-neutral text generation provider interface and local reference adapters"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Agentic Engineering Toolkit Contributors" }]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
