[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
description = "Local-first LangGraph retrieval-augmented application starter"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "langgraph>=0.2,<2",
    "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
openai = ["langchain-openai>=1,<2"]
azure-openai = ["langchain-openai>=1,<2"]
anthropic = ["langchain-anthropic>=1,<2"]
bedrock = ["langchain-aws>=1,<2"]
cloud = ["langchain-openai>=1,<2", "langchain-anthropic>=1,<2", "langchain-aws>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*"]
