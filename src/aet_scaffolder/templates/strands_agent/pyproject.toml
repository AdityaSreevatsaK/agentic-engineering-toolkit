[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "__PROJECT_NAME__"
version = "0.1.0"
description = "Local-first AWS Strands SDK agent starter"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2,<3",
    "strands-agents>=1.60,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
openai = ["strands-agents[openai]>=1.60,<2"]
azure-openai = ["strands-agents[openai]>=1.60,<2"]
anthropic = ["strands-agents[anthropic]>=1.60,<2"]
cloud = ["strands-agents[openai,anthropic]>=1.60,<2"]

[tool.setuptools.packages.find]
include = ["app*"]
