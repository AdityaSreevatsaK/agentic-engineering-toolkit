name: dependency-boundary-compatibility
# Exercise the minimum permitted direct versions and latest compatible versions
# without requiring any cloud credentials or model inference.
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/aet_scaffolder/templates/**/pyproject.toml'
      - '.github/workflows/dependency-compatibility.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * 2'

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        template: [tool-agent, langgraph-rag, strands-agent, llamaindex-rag]
        resolution: [lowest-direct, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install scaffolder and dependency solver
        run: python -m pip install -e . "uv>=0.9,<1"
      - name: Generate project and resolve dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m aet_scaffolder new compatibility-app --template "${{ matrix.template }}" --provider mock
          uv pip compile compatibility-app/pyproject.toml --resolution "${{ matrix.resolution }}" --extra dev --output-file resolved.txt
          uv venv compatibility-app/.venv --python 3.12 --seed
          uv pip sync resolved.txt --python compatibility-app/.venv/bin/python
          uv pip install --python compatibility-app/.venv/bin/python --no-deps -e ./compatibility-app
          compatibility-app/.venv/bin/python -m pip check
      - name: Run generated offline test suite against resolved dependency boundary
        working-directory: compatibility-app
        run: .venv/bin/python -m pytest -q
