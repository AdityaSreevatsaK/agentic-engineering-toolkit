name: dependency-vulnerability-audit

# Separate release/supply-chain audit: it downloads upstream advisory data,
# so it is intentionally NOT a mandatory offline PR check.
on:
  workflow_dispatch:
  # Audit changed dependency declarations before they are merged. No secrets or paid inference.
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'pyproject.toml'
      - 'src/aet_scaffolder/templates/**/pyproject.toml'
  # A tag triggers evidence collection; the GitHub tag is not itself blocked.
  push:
    tags: ['v*']
  schedule:
    - cron: '20 5 1 * *'

permissions:
  contents: read

jobs:
  resolved-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        template: [tool-agent, langgraph-rag, strands-agent, llamaindex-rag]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install audit tooling and scaffolder
        run: python -m pip install -e . "pip-audit>=2.7,<3"
      - name: Generate the provider-neutral reference app
        run: python -m aet_scaffolder new audit-app --template ${{ matrix.template }} --provider mock
      - name: Resolve and install optional provider SDKs without credentials
        run: python -m pip install -e "./audit-app[dev,cloud]"
      - name: Include the optional LlamaIndex Ollama dependency family
        if: matrix.template == 'llamaindex-rag'
        run: python -m pip install -e "./audit-app[ollama]"
      - name: Verify complete resolved environment is dependency-consistent
        run: python -m pip check
      - name: Save exact resolved dependency versions
        if: always()
        run: python -m pip freeze --all > resolved-versions.txt
      - name: Audit resolved packages against current advisories
        run: python -m pip_audit --format json --output dependency-audit.json
      - name: Retain audit evidence even when vulnerabilities are found
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-audit-${{ matrix.template }}-linux-py3.12
          path: |
            dependency-audit.json
            resolved-versions.txt
          if-no-files-found: warn
          retention-days: 30
