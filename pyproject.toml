[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aet-scaffolder"
version = "0.8.0"
description = "Local-first agent project scaffolder"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agentic Engineering Toolkit Contributors" }]

[project.optional-dependencies]
demo = [
    "fastapi>=0.110,<1",
    "langgraph>=0.2,<2",
    "pydantic-settings>=2,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
agentkit = "aet_scaffolder.cli:main"
agentkit-benchmark = "aet_scaffolder.benchmark_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aet_scaffolder = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixture contains original old generated tests: validate as source, do not collect
# them as root tests without installing that old generated app/dependencies.
norecursedirs = ["tests/fixtures/pre_m11_tool_agent", "build", "dist", ".venv"]
