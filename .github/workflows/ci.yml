name: ci
# Run one matrix per PR update; test the final integrated commit on master.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel stale PR runs when a newer commit arrives, without removing any CI jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  quality:
    name: quality (ruff, mypy, bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - name: Install pinned local quality tools
        run: python -m pip install ruff==0.14.3 mypy==1.18.2 bandit==1.8.6
      - name: Ruff correctness and lint check
        run: python -m ruff check --select E4,E7,E9,F src tests scripts packages
      - name: Focused static type check of scaffolder registry
        run: python -m mypy --follow-imports=skip --ignore-missing-imports src/aet_scaffolder/registry.py
      - name: Bandit high-severity Python security check
        run: python -m bandit -q -r src/aet_scaffolder --severity-level high --confidence-level high -x '*/tests/*'

  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - name: Install scaffolder and test tools
        run: python -m pip install -e . pytest
      - name: Test scaffolder and doctor
        run: python -m pytest tests -q
      - name: Verify M15 automated structural adoption preflight (not a human trial)
        run: python scripts/adoption_preflight.py
      - name: Verify empty pilot template makes no productivity claims
        run: python scripts/analyze_pilot.py --input docs/pilot/trials-template.csv
      - name: Generate mock project
        run: python -m aet_scaffolder new mock-demo --output-dir .
      - name: Doctor-check mock project
        run: python -m aet_scaffolder doctor mock-demo --json
      - name: Install mock generated app
        run: python -m pip install -e ".[dev]"
        working-directory: mock-demo
      - name: Test mock generated app
        run: python -m pytest -q
        working-directory: mock-demo
      - name: Install independent Agent Quality Kit
        run: python -m pip install -e "./packages/agent-quality-kit[dev]"
      - name: Run standalone Quality Kit unit tests
        run: python -m pytest packages/agent-quality-kit/tests -q
      - name: Test Quality Kit against a freshly generated agent
        run: python -m pytest examples/quality-kit-demo -q
      - name: Build standalone Quality Kit wheel
        run: python -m pip wheel ./packages/agent-quality-kit --no-deps --wheel-dir quality-wheelhouse
      - name: Reinstall standalone Quality Kit from built wheel
        run: python -c "import glob, subprocess, sys; wheels=glob.glob('quality-wheelhouse/*.whl'); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"
      - name: Run Quality Kit tests from packaged wheel
        run: python -m pytest packages/agent-quality-kit/tests -q
      - name: Install independent portable provider contract
        run: python -m pip install -e "./packages/agent-provider-contract[dev]"
      - name: Test provider protocol and fake local Ollama transport
        timeout-minutes: 5
        run: python -m pytest packages/agent-provider-contract/tests -vv --tb=short -s
      - name: Test provider contract bridge against generated mock app
        run: python -m pytest examples/provider-portability-demo -q
      - name: Build portable provider contract wheel
        run: python -m pip wheel ./packages/agent-provider-contract --no-deps --wheel-dir provider-wheelhouse
      - name: Reinstall portable provider contract from built wheel
        run: python -c "import glob, subprocess, sys; wheels=glob.glob('provider-wheelhouse/*.whl'); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"
      - name: Verify contract tests with packaged wheel
        run: python -m pytest packages/agent-provider-contract/tests -q
      - name: Run offline M7 three-asset acceptance demo
        run: python scripts/run_demo.py --json-out m7-demo-results.json
      - name: Retain sanitized M7 demo evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m7-demo-${{ matrix.os }}-py${{ matrix.python-version }}
          path: m7-demo-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Evaluate generated agent against synthetic Olist-shaped records
        run: python scripts/evaluate_olist.py --input tests/fixtures/olist_orders_synthetic.csv --sample 8 --queries 8 --seed 19 --dataset-kind synthetic --json-out m9-olist-synthetic.json
      - name: Retain clearly labeled synthetic order evaluation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m9-synthetic-olist-${{ matrix.os }}-py${{ matrix.python-version }}
          path: m9-olist-synthetic.json
          if-no-files-found: error
          retention-days: 14
      - name: Run synthetic NYC 311 status evaluator
        run: python scripts/evaluate_nyc311.py --synthetic-input tests/fixtures/nyc311_synthetic.json --queries 6 --json-out m10-nyc311-synthetic.json
      - name: Save clearly labeled synthetic NYC 311 results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m10-nyc311-synthetic-${{ matrix.os }}-py${{ matrix.python-version }}
          path: m10-nyc311-synthetic.json
          if-no-files-found: error
          retention-days: 14
      # Live NYC 311 public-data evaluation is opt-in in nyc311-live.yml.
      # Required CI remains fully synthetic and independent of the public API.
      - name: Generate Ollama project (no model download)
        run: python -m aet_scaffolder new ollama-demo --output-dir . --provider ollama --model llama3.2:1b
      - name: Doctor-check Ollama project
        run: python -m aet_scaffolder doctor ollama-demo --json
      - name: Install Ollama generated app
        run: python -m pip install -e ".[dev]"
        working-directory: ollama-demo
      - name: Test Ollama generated app with mocked local HTTP
        run: python -m pytest -q
        working-directory: ollama-demo
      - name: Generate offline LangGraph RAG project
        run: python -m aet_scaffolder new rag-demo --template langgraph-rag --provider mock --output-dir .
      - name: Doctor-check generated RAG project
        run: python -m aet_scaffolder doctor rag-demo --json
      - name: Install RAG project
        run: python -m pip install -e ".[dev]"
        working-directory: rag-demo
      - name: Test RAG retrieval, mocked Ollama, ingestion and API
        run: python -m pytest -q
        working-directory: rag-demo
      - name: Generate Ollama-configured LangGraph RAG project
        run: python -m aet_scaffolder new rag-ollama-demo --template langgraph-rag --provider ollama --output-dir .
      - name: Doctor-check Ollama RAG project
        run: python -m aet_scaffolder doctor rag-ollama-demo --json
      - name: Install Ollama RAG project (no live model)
        run: python -m pip install -e ".[dev]"
        working-directory: rag-ollama-demo
      - name: Test Ollama RAG with mocked transport
        run: python -m pytest -q
        working-directory: rag-ollama-demo
      - name: Generate offline native LlamaIndex RAG project
        run: python -m aet_scaffolder new llamaindex-demo --template llamaindex-rag --provider mock --output-dir .
      - name: Doctor-check native LlamaIndex project
        run: python -m aet_scaffolder doctor llamaindex-demo --json
      - name: Install LlamaIndex generated app
        timeout-minutes: 8
        run: python -m pip install -e ".[dev]"
        working-directory: llamaindex-demo
      - name: Run native LlamaIndex offline retrieval, SDK fake and API tests
        timeout-minutes: 5
        env:
          AET_PROVIDER: mock
        run: python -m pytest -vv --tb=short
        working-directory: llamaindex-demo
      - name: Generate LlamaIndex cloud-configured project without paid calls
        run: python -m aet_scaffolder new llamaindex-cloud-demo --template llamaindex-rag --provider openai --output-dir .
      - name: Doctor-check LlamaIndex cloud project without credentials
        run: python -m aet_scaffolder doctor llamaindex-cloud-demo --json
      - name: Generate offline AWS Strands SDK agent
        run: python -m aet_scaffolder new strands-demo --template strands-agent --provider mock --output-dir .
      - name: Doctor-check Strands mock project
        run: python -m aet_scaffolder doctor strands-demo --json
      - name: Install Strands mock app
        run: python -m pip install -e ".[dev]"
        working-directory: strands-demo
      - name: Exercise real Strands SDK offline tool calls and fake Bedrock config
        run: python -m pytest -q
        working-directory: strands-demo
      - name: Generate Bedrock-configured Strands project (no cloud calls)
        run: python -m aet_scaffolder new strands-bedrock-demo --template strands-agent --provider bedrock --output-dir .
      - name: Doctor-check Strands Bedrock project
        run: python -m aet_scaffolder doctor strands-bedrock-demo --json
      - name: Install Strands Bedrock-mode project
        run: python -m pip install -e ".[dev]"
        working-directory: strands-bedrock-demo
      - name: Verify Bedrock wiring with injected offline SDK model
        run: python -m pytest -q
        working-directory: strands-bedrock-demo
      - name: Check installed dependency consistency after generated-app installs
        run: python -m pip check
      - name: Build and smoke-test all four generated Docker images (loopback only)
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        timeout-minutes: 24
        run: python scripts/docker_smoke.py --json-out docker-smoke.json
      - name: Build standalone wheel
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - name: Install the packaged wheel (not editable)
        run: python -c "import glob, subprocess, sys; wheels = glob.glob('wheelhouse/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"
      - name: Confirm wheel distribution bundles templates
        run: python -m aet_scaffolder new packaged-demo --output-dir . --provider ollama
      - name: Doctor-check wheel-generated project
        run: python -m aet_scaffolder doctor packaged-demo --json
      - name: Confirm wheel bundles LangGraph RAG template
        run: python -m aet_scaffolder new packaged-rag --template langgraph-rag --output-dir .
      - name: Doctor-check wheel-generated RAG project
        run: python -m aet_scaffolder doctor packaged-rag --json
      - name: Confirm packaged wheel bundles AWS Strands template
        run: python -m aet_scaffolder new packaged-strands --template strands-agent --output-dir .
      - name: Doctor-check wheel-generated Strands project
        run: python -m aet_scaffolder doctor packaged-strands --json
      - name: Confirm packaged wheel bundles LlamaIndex RAG template
        run: python -m aet_scaffolder new packaged-llamaindex --template llamaindex-rag --output-dir .
      - name: Doctor-check wheel-generated LlamaIndex RAG project
        run: python -m aet_scaffolder doctor packaged-llamaindex --json
      - name: M19 verify actual offline generated-app API and RAG corpus updates
        timeout-minutes: 6
        run: python scripts/release_smoke.py --json-out m19-machine-smoke.json
      - name: Retain sanitised M19 machine-only evidence (not a human trial)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m19-machine-smoke-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            m19-machine-smoke.json
            docker-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: Install and exercise four independent generated-app virtualenvs
        timeout-minutes: 30
        run: python -m scripts.isolated_install_smoke --json-out isolated-installations.json --versions-dir isolated-resolved --jobs 2
      - name: Retain per-template independent Python environment evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: isolated-install-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            isolated-installations.json
            isolated-resolved/
          if-no-files-found: warn
          retention-days: 30
      - name: Run all declared template-provider pairs with offline API probes
        timeout-minutes: 20
        run: python -m scripts.comprehensive_matrix --json-out comprehensive-matrix.json
      - name: Retain per-pair exhaustive offline matrix evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: comprehensive-matrix-${{ matrix.os }}-py${{ matrix.python-version }}
          path: comprehensive-matrix.json
          if-no-files-found: error
          retention-days: 30
      - name: Bounded deep-event, concurrency and security testing (mock only)
        timeout-minutes: 20
        run: python -m scripts.deep_event_matrix --json-out deep-event-results.json --csv-out deep-event-metrics.csv --failures-out deep-event-failures.jsonl --security-out deep-event-security.json
      - name: Hash deep-event evidence with commit/run provenance
        if: always()
        run: python -m scripts.evidence_manifest --out deep-event-manifest.json deep-event-results.json deep-event-metrics.csv deep-event-failures.jsonl deep-event-security.json
      - name: Retain deep-event security and performance evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deep-event-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            deep-event-results.json
            deep-event-metrics.csv
            deep-event-failures.jsonl
            deep-event-security.json
            deep-event-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Benchmark local project generation (not human time saved)
        run: python -m aet_scaffolder.benchmark_cli --runs 3 --warmups 1 --provider mock
      - name: Capture resolved dependency versions (evidence, not a lockfile)
        if: always()
        run: python -m pip freeze --all > ci-resolved-dependencies.txt
      - name: Retain resolved CI dependency evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-resolved-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ci-resolved-dependencies.txt
          if-no-files-found: warn
          retention-days: 14
