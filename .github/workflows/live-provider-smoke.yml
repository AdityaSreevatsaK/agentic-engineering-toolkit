name: authorised-live-provider-smoke
# Manual, paid and opt-in. Configure the provider-smoke environment with
# required reviewers, spending limits and narrowly scoped provider credentials.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Authorised provider for one short test request
        required: true
        type: choice
        options: [openai, azure-openai, anthropic, bedrock]

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: provider-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install scaffolder and generate a disposable tool-agent app
        run: |
          python -m pip install -e .
          python -m aet_scaffolder new live-smoke --template tool-agent --provider mock
          python -m pip install -e "./live-smoke[dev,cloud]"
      - name: Exercise one authorised live inference call (response redacted)
        working-directory: live-smoke
        timeout-minutes: 4
        env:
          AET_PROVIDER: ${{ inputs.provider }}
          AET_SECURITY_MODE: hardened
          AET_TENANT_KEYS_JSON: ${{ secrets.AET_SMOKE_TENANT_KEYS_JSON }}
          AET_SMOKE_TOKEN: ${{ secrets.AET_SMOKE_TOKEN }}
          AET_MODEL_TIMEOUT_SECONDS: '20'
          AET_MODEL_MAX_RETRIES: '0'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AET_OPENAI_MODEL: ${{ secrets.AET_OPENAI_MODEL }}
          AET_ANTHROPIC_MODEL: ${{ secrets.AET_ANTHROPIC_MODEL }}
          AET_AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AET_AZURE_OPENAI_DEPLOYMENT }}
          AET_AZURE_OPENAI_ENDPOINT: ${{ secrets.AET_AZURE_OPENAI_ENDPOINT }}
          AET_AZURE_OPENAI_API_VERSION: ${{ secrets.AET_AZURE_OPENAI_API_VERSION }}
          AET_BEDROCK_MODEL_ID: ${{ secrets.AET_BEDROCK_MODEL_ID }}
          AET_AWS_REGION: ${{ secrets.AET_AWS_REGION }}
        run: |
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from app.main import app

          token = os.environ.get("AET_SMOKE_TOKEN", "")
          if len(token) < 32:
              raise SystemExit("Missing approved smoke token")
          response = TestClient(app).post(
              "/invoke", json={"question": "Reply with OK."},
              headers={"Authorization": "Bearer " + token},
          )
          if response.status_code != 200:
              raise SystemExit("Live provider contract failed; response redacted")
          print("Live provider contract succeeded; model output redacted")
          PY
