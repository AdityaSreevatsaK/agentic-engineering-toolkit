name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scaffolder + pytest
        run: python -m pip install -e . pytest
      - name: Test scaffolder
        run: python -m pytest tests -q
      - name: Generate demo project
        run: python -m aet_scaffolder new demo-agent --output-dir .
      - name: Install generated application
        run: python -m pip install -e ".[dev]"
        working-directory: demo-agent
      - name: Test generated application
        run: python -m pytest -q
        working-directory: demo-agent
