name: generated-app-ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install app and test dependencies
        run: python -m pip install -e ".[dev]" ruff==0.14.3
      - name: Lint generated application and tests
        run: python -m ruff check --select E4,E7,E9,F app tests
      - name: Run offline generated-app tests
        env:
          AET_PROVIDER: mock
        run: python -m pytest -q
